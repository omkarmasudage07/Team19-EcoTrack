server:
  port: 8080

spring:
  cloud:
    gateway:
      # CORS is handled once, centrally, at the Gateway. No individual
      # microservice needs its own CORS configuration.
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - "*"
            allowedHeaders:
              - "*"
            allowCredentials: true
      httpclient:
        connect-timeout: 10000
        response-timeout: 15s
        pool:
          type: ELASTIC
          max-idle-time: 10000ms
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials Access-Control-Allow-Methods Access-Control-Allow-Headers, RETAIN_UNIQUE
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/citizens/**,/api/v1/recyclers/**,/api/v1/industries/**,/api/v1/recycler-applications/**,/api/v1/industry-applications/**,/api/v1/users/**,/api/v1/regions/**

        - id: pickup-service
          uri: lb://pickup-service
          predicates:
            - Path=/api/v1/pickups/**,/api/v1/waste-categories/**

        - id: material-service
          uri: lb://material-service
          predicates:
            - Path=/api/v1/materials/**,/api/v1/categories/**,/api/v1/orders/**,/api/v1/ecopoints/**,/api/v1/rewards/**,/api/v1/ecopoint-rules/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**

# Same secret as auth-service - the Gateway must be able to validate the
# same tokens that the Auth Service issues.
ecotrack:
  jwt:
    secret: ZWNvdHJhY2stc3VwZXItc2VjcmV0LWtleS1mb3Itand0LXNpZ25pbmctbXVzdC1iZS1sb25n

logging:
  level:
    com.ecotrack.gateway: INFO
    org.springframework.cloud.gateway: INFO
